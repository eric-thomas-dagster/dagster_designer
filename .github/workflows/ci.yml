name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      # `npm run lint` is left out here: eslint 9 needs an eslint.config.js
      # this project doesn't have (pre-existing gap, not something this
      # workflow introduced) -- it currently just errors immediately rather
      # than linting anything. Worth fixing separately.

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check all backend modules
        run: python -m compileall -q backend/app backend/dagster_designer_components

  # These two guard against the exact bug classes that broke the Windows
  # build repeatedly this session -- both are silent at runtime until
  # someone actually launches on Windows, so a plain import/compile check
  # above wouldn't catch a regression. Grepping for the anti-pattern
  # directly is cheap and catches it at PR time instead.
  windows-path-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No hardcoded .venv/bin paths outside the shared helper
        run: |
          matches=$(grep -rn '\.venv"\s*/\s*"bin"\|venv_dir\s*/\s*"bin"' backend/app --include="*.py" \
            | grep -v "app/core/uv_binary.py" || true)
          if [ -n "$matches" ]; then
            echo "Found hardcoded Unix-only venv/bin paths -- use venv_bin_path() from app/core/uv_binary.py instead (see project_service.py's history for why: it silently breaks on Windows, where binaries live under Scripts/*.exe)."
            echo "$matches"
            exit 1
          fi
      - name: No bash-only shell syntax in subprocess calls
        run: |
          matches=$(grep -rln 'create_subprocess_shell(\|shell=True\|"bash", "-c"\|\[.bash.,' backend/app --include="*.py" || true)
          if [ -n "$matches" ]; then
            echo "Found shell=True / create_subprocess_shell / bash -c usage -- these use cmd.exe on Windows, which doesn't understand bash builtins like export/unset/source. Call the resolved binary directly via subprocess.run/create_subprocess_exec with env= instead."
            echo "$matches"
            exit 1
          fi
